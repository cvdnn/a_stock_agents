name: CI - Test & Delivery Gate Matrix

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-matrix:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-xdist pyyaml

      - name: Run P0 Core Test Gate (① 核心门禁)
        run: |
          python -m pytest -m core -ra

      - name: Run Release Delivery Gate & Isolated Extraction (发布链路检验与隔离解压验收)
        run: |
          python -m pytest tests/core/test_release_delivery_gate.py -v -ra

      - name: Verify Packaging Build & Doctor Smoke Check (打包构建与诊断冒烟)
        run: |
          python tools/packaging/common.py --tag ci-${{ matrix.python-version }}
          python skill_bundle/runtime/doctor.py

      - name: Platform Installation Smoke Check (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x install.sh
          bash install.sh -Inspect -Json
          chmod +x skill_bundle/runtime/astock
          ./skill_bundle/runtime/astock version --json || python skill_bundle/runtime/cli.py version --json

      - name: Platform Installation Smoke Check (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          powershell -File install.ps1 -Inspect -Json
          powershell -File skill_bundle/runtime/astock.ps1 version --json
