[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "a_stock_agents"
version = "3.0.0"
description = "A-Stock Multi-Agent Quantitative Research & Trading Framework (v3)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0",
    "pandas>=1.5.0",
    "numpy>=1.22.0",
    "tabulate>=0.9.0",
    "pyyaml>=6.0",
    "scipy>=1.9.0",
    "beautifulsoup4>=4.11.0",
    "colorama>=0.4.6"
]

[project.scripts]
astock = "core.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*"]

