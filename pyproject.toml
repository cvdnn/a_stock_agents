[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "a_stock_agents"
version = "3.0.0"
description = "A-Stock Multi-Agent Quantitative Research & Trading Framework (v3)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0",
    "pandas>=1.5.0",
    "numpy>=1.22.0",
    "tabulate>=0.9.0",
    "pyyaml>=6.0",
    "scipy>=1.9.0",
    "beautifulsoup4>=4.11.0",
    "colorama>=0.4.6",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
full = [
    "akshare>=1.12.0",
    "efinance>=0.5.0",
]

[project.scripts]
astock = "core.cli:main"

[tool.setuptools.packages.find]
where = ["scripts"]
include = ["core*", "server*", "tools*"]

[tool.pytest.ini_options]
pythonpath = ["scripts", "."]

