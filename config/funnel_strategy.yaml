version: 1
strategy:
  id: close_to_open_turning_point
  name: 收盘突破至早盘拐点漏斗
  timezone: Asia/Shanghai
  notes:
    - 默认按公式原文使用20日新高；将 breakout_high.lookback 改为60即可切换。
    - 默认高开区间为1%至2%；若“只要高开”则将 min 改为0且 max改为null。
    - 量能口径：默认沿用公式原文的单日放量（今日量>昨日量）；如需“量能持续放大”，启用 volume_sustained_expansion（近N日均量/前M日均量，参数 window/baseline_window/min_ratio 可微调）。
    - 收盘初筛最早15:35，须等 UniverseWatermark 达标后执行；15:05-15:30 为交易所清算期，禁止使用未定盘数据。
    - main_fund_inflow 已设 enabled=false：主力资金流契约本期未建立，规则参数保留，契约落地后改回 true 即生效。
    - 拐点双轨：本期无主动买卖量与盘口契约，sell_exhaustion/buy_strengthening/book_support 仅作预留，故 min_confirmations 设为0（形态版）。
    - 盘口契约落地后恢复供需版：须同时把 sell_exhaustion 放回 required，并将 min_confirmations 改为1；只改 min_confirmations 会被 book_support 单独满足，不能保证含真实主动买卖量。
    - 拐点在窗口结束（09:40）一次性收敛输出，窗口内命中只记为待定候选，不再即时锁存。

stages:
  - id: post_close
    name: 收盘后硬条件初筛
    scope: candidate_filter
    schedule: "15:35-23:59"
    rules:
      - id: exclude_st
        type: text_exclude
        field: name
        tokens: [ST, "*ST", 退]
      - id: exclude_bse
        type: symbol_prefix_exclude
        field: code
        prefixes: [4, 8, 92]
      - id: minimum_float_market_cap
        type: field_compare
        field: circulating_market_cap
        op: gt
        value: 3000000000
      - id: daily_gain_below_7pct
        type: field_compare
        field: change_pct
        op: lt
        value: 7.0
      - id: breakout_high
        type: rolling_high
        field: closes
        lookback: 20
        strict: true
      - id: close_above_ma60
        type: above_sma
        series_field: closes
        period: 60
        strict: true
      - id: ma60_rising
        type: sma_slope
        field: closes
        period: 60
        lag: 1
        min_slope_pct: 0.0
        strict: true
      - id: volume_expansion
        type: series_compare
        field: volumes
        left_offset: -1
        right_offset: -2
        op: gt
      - id: volume_sustained_expansion
        enabled: false   # 与单日放量并存；改为 true 即启用“量能持续放大”口径，并按需调参
        type: volume_sustained_expansion
        field: volumes
        window: 3
        baseline_window: 5
        min_ratio: 1.0
        strict: true
      - id: main_fund_inflow
        enabled: false
        type: field_compare
        field: main_net_inflow
        op: gt
        value: 0

  - id: market_gate
    name: 次日大盘MA20门控
    scope: universe_gate
    schedule: "09:30-09:35"
    rules:
      - id: index_above_ma20
        type: market_above_sma
        benchmark: sh000001
        price_field: market.current_price
        series_field: market.completed_closes
        period: 20
        strict: true

  - id: opening_gap
    name: 次日开盘高开过滤
    scope: candidate_filter
    schedule: "09:30-09:31"
    rules:
      - id: gap_range
        type: range
        field: gap_pct
        min: 1.0
        max: 2.0

  - id: turning_point
    name: 早盘回调与供需拐点确认
    scope: candidate_filter
    schedule: "09:36-09:40"
    rules:
      - id: pullback_supply_demand_turn
        type: intraday_turning_point
        points_field: minute_points
        window_start: "09:30"
        window_end: "09:40"
        pullback_end: "09:35"
        confirm_start: "09:36"
        min_points: 6
        min_pullback_pct: 0.20
        max_pullback_pct: 2.00
        max_sell_ratio: 0.75
        min_buy_ratio: 1.20
        min_book_ratio: 1.20
        min_pullback_points: 3
        min_confirm_points: 2
        required: [pullback, price_reversal]
        confirmations: [sell_exhaustion, buy_strengthening, book_support]
        min_confirmations: 0
        output_policy: converge_at_window_end
        metric_policy: real_only_for_signal

# --- 声明态参数块（status: declared）---------------------------------------------
# 与 stages 同级，不进入 stages 列表：FunnelEngine 仅支持 candidate_filter 与
# universe_gate 两种 scope，且 validate_stage 要求每个 stage 必须有非空 rules。
# 下列两块参数已冻结（可视化配置可展示与校验），但引擎尚未实现 Stage 1.5 / Stage 4，
# 因此不参与执行；引擎落地后改为 active 并同构迁移，参数值不变。
# 参数蓝本：selection-model-general-specification.md §9。
ranking:
  status: declared
  name: 盘后候选排序截断
  stage: stage1_5_rank
  top_n: 20                 # “选择项很多”时的截断阈值
  persist_to: output/pools/watch_opening_reversal.csv
  factors:
    - {id: breakout_strength, weight: 0.20}
    - {id: ma60_slope_norm,   weight: 0.20}
    - {id: volume_quality,    weight: 0.15}
    - {id: inflow_intensity,  weight: 0.20}
    - {id: change_pct_sweet,  weight: 0.15, params: {lo: 3.0, hi: 6.0}}
    - {id: float_cap_score,   weight: 0.10, params: {lo: 3.0e9, hi: 3.0e10}}

risk_exit:
  status: declared
  name: 持仓风控离场
  stage: stage4_exit
  order_window: {start: "09:40:00"}   # 09:40 收敛后才可下单
  t1_constraint: true                 # ★ 本策略受 T+1 约束
  intraday_controls:
    single_position_max_pct: 20
    daily_total_max_pct: 40
    max_concurrent_holdings: 3
    weak_market_halve_below: 60       # 五维健康度低于 60 则减半
    gap_inverse_sizing: true
  stop_ladder:
    - {level: T0, drawdown_pct: -3, action: alert}
    - {level: T1, drawdown_pct: -5, action: reduce_50, exec: next_open}
    - {level: T2, drawdown_pct: -8, action: clear,     exec: next_open}
    - {level: T_GAP,  condition: open_below_stop,        action: clear_at_open, exec: next_open_immediate}
    - {level: T_TIME, condition: not_profitable_by_close, action: clear,        exec: t2_1450}
  breakeven: {skill: astock-action-execution, round: ceil_to_cent}   # 保本价向上进位至分
