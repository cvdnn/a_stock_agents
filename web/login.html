<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · GC量化投资助手</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ====================================================================
       Login Page - 高度还原设计稿：浅蓝品牌区 + 白色登录表单
       ==================================================================== */
    html, body.login-page {
      overflow: hidden;
      height: 100vh;
    }
    body.login-page {
      background:
        radial-gradient(ellipse at 0% 0%, #E8F3FF 0%, transparent 55%),
        radial-gradient(ellipse at 100% 100%, #EAF4FF 0%, transparent 60%),
        linear-gradient(135deg, #EEF6FF 0%, #F6FAFE 50%, #F1F7FE 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-shell {
      width: 100%;
      max-width: 1080px;
      min-height: 600px;
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      background: #fff;
      border: 1px solid var(--border-card);
      border-radius: 18px;
      box-shadow: 0 30px 80px rgba(22, 119, 255, 0.10), 0 6px 18px rgba(0, 0, 0, 0.04);
      overflow: hidden;
    }

    /* ======================== 左侧品牌区 ======================== */
    .login-brand {
      position: relative;
      padding: 44px 44px 40px;
      background:
        radial-gradient(circle at 85% 10%, rgba(180, 215, 255, 0.55) 0%, rgba(180, 215, 255, 0) 45%),
        radial-gradient(circle at 15% 90%, rgba(190, 220, 255, 0.45) 0%, rgba(190, 220, 255, 0) 50%),
        linear-gradient(135deg, #E8F2FE 0%, #F1F7FE 55%, #FFFFFF 100%);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 头部品牌标识 */
    .brand-header {
      display: flex;
      align-items: center;
      gap: 14px;
      position: relative;
      z-index: 2;
    }
    .brand-logo {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #2B7FFF 0%, #1677FF 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 18px;
      letter-spacing: 0.5px;
      box-shadow: 0 8px 18px rgba(22, 119, 255, 0.28);
    }
    .brand-title-block { display: flex; flex-direction: column; line-height: 1.2; }
    .brand-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-title);
      letter-spacing: 0.5px;
    }
    .brand-subtitle {
      margin-top: 4px;
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 1px;
    }
    .brand-divider {
      width: 1px;
      height: 30px;
      background: #C9D6E8;
      margin: 0 4px;
    }
    .brand-tagline {
      font-size: 13px;
      color: var(--primary);
      font-weight: 500;
      letter-spacing: 1px;
    }

    /* 主标题区 */
    .brand-hero {
      margin-top: 32px;
      position: relative;
      z-index: 2;
    }
    .brand-headline {
      font-size: 36px;
      font-weight: 800;
      color: var(--text-title);
      line-height: 1.22;
      letter-spacing: 1px;
    }
    .brand-headline .accent {
      background: linear-gradient(135deg, #2B7FFF 0%, #1677FF 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .brand-desc {
      margin-top: 18px;
      font-size: 13px;
      line-height: 1.85;
      color: var(--text-body);
      max-width: 360px;
    }

    /* 内容区：左特性列表 + 右插图 */
    .brand-content {
      margin-top: 32px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      align-items: center;
      position: relative;
      z-index: 2;
      flex: 1;
    }
    .brand-features {
      display: grid;
      gap: 16px;
    }
    .brand-feature {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .feature-icon {
      flex: 0 0 auto;
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: rgba(22, 119, 255, 0.10);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
    }
    .feature-text { line-height: 1.4; }
    .feature-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-title);
    }
    .feature-desc {
      margin-top: 2px;
      font-size: 12px;
      color: var(--text-muted);
    }

    /* 3D 插图区域 */
    .brand-illustration {
      position: relative;
      width: 100%;
      height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .illustration-svg {
      width: 100%;
      height: 100%;
    }

    /* ======================== 右侧登录表单区 ======================== */
    .login-panel {
      padding: 56px 56px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: #FFFFFF;
      position: relative;
    }
    .login-title {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-title);
      letter-spacing: 1px;
    }
    .login-subtitle {
      margin-top: 8px;
      font-size: 13px;
      color: var(--text-muted);
    }
    .login-form {
      margin-top: 36px;
      display: grid;
      gap: 20px;
    }
    .login-field {
      display: grid;
      gap: 8px;
    }
    .login-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-title);
    }
    .login-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .login-input-icon {
      position: absolute;
      left: 14px;
      color: #B8C2CC;
      display: flex;
      align-items: center;
      pointer-events: none;
    }
    .login-input {
      width: 100%;
      padding: 13px 14px 13px 42px;
      border-radius: 10px;
      border: 1px solid #E5EAF0;
      background: #fff;
      font-size: 14px;
      color: var(--text-title);
      transition: border-color 0.18s, box-shadow 0.18s;
      outline: none;
    }
    .login-input::placeholder { color: #B8C2CC; }
    .login-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(22, 119, 255, 0.12);
    }
    .login-input-wrap.has-toggle .login-input { padding-right: 42px; }
    .login-toggle {
      position: absolute;
      right: 14px;
      background: none;
      border: none;
      color: #B8C2CC;
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 4px;
      transition: color 0.15s;
    }
    .login-toggle:hover { color: var(--primary); }

    .login-error {
      background: var(--color-up-bg);
      border: 1px solid var(--color-up-border);
      color: var(--color-up-dark);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      display: none;
    }
    .login-error.show { display: block; }

    .login-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: var(--text-body);
      margin-top: -4px;
    }
    .login-remember {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }
    .login-remember input[type="checkbox"] {
      width: 14px;
      height: 14px;
      accent-color: var(--primary);
      cursor: pointer;
    }
    .login-forgot {
      color: var(--primary);
      text-decoration: none;
      transition: opacity 0.15s;
    }
    .login-forgot:hover { opacity: 0.78; }

    .login-submit {
      margin-top: 8px;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #2B7FFF 0%, #1677FF 100%);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 2px;
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.18s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .login-submit:hover {
      box-shadow: 0 10px 24px rgba(22, 119, 255, 0.32);
      transform: translateY(-1px);
    }
    .login-submit:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .login-footer {
      margin-top: 22px;
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.7;
    }
    .login-footer a {
      color: var(--primary);
      text-decoration: none;
      transition: opacity 0.15s;
    }
    .login-footer a:hover { opacity: 0.78; }

    /* 响应式 */
    @media (max-width: 960px) {
      .login-shell {
        grid-template-columns: 1fr;
        max-width: 460px;
      }
      .login-brand {
        padding: 32px 28px;
      }
      .brand-content { display: none; }
      .brand-headline { font-size: 26px; }
      .brand-hero { margin-top: 24px; }
      .login-panel { padding: 36px 32px 32px; }
    }
  </style>
</head>
<body class="login-page">

      </div>

      <div id="loginError" class="login-error"></div>

      <form class="login-form" id="loginForm" autocomplete="off">
        <div class="login-field">
          <label class="login-label" for="loginPhone">手机号</label>
          <div class="login-input-wrap">

        <div class="login-field">

        <div class="login-options">

            <input type="checkbox" id="rememberAccount">

          <a href="#" class="login-forgot">忘记密码？</a>
        </div>

        <button class="login-submit" type="submit" id="loginSubmit">
          <span>登 录</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </form>

      <div class="login-footer">
        登录即表示您已阅读并同意<a href="#">《用户协议》</a>和<a href="#">《隐私政策》</a>
      </div>
    </section>
  </div>

  <script src="js/auth.js"></script>
  <script>
    // 若已登录则直接跳转到主工作台
    (async function bootstrap() {
      try {
        const me = await window.AstockAuth.fetchMe();
        if (me && me.user) {
          window.location.replace("/ui/");
        }
      } catch (e) {
        // ignore
      }

      const form = document.getElementById("loginForm");
      const errorEl = document.getElementById("loginError");
      const submitBtn = document.getElementById("loginSubmit");
      const phoneInput = document.getElementById("loginPhone");
      const passwordInput = document.getElementById("loginPassword");
      const rememberEl = document.getElementById("rememberAccount");

      // 记住账号
      try {
        const saved = localStorage.getItem("astock_login_phone");
        if (saved) {
          phoneInput.value = saved;
          rememberEl.checked = true;
        }
      } catch (e) { /* ignore */ }

      // 密码可见切换
      const toggleBtn = document.getElementById("togglePassword");
      const eyeOff = document.getElementById("eyeOffIcon");
      const eyeOn = document.getElementById("eyeOnIcon");
      toggleBtn.addEventListener("click", () => {
        const isPwd = passwordInput.type === "password";
        passwordInput.type = isPwd ? "text" : "password";
        eyeOff.style.display = isPwd ? "none" : "";
        eyeOn.style.display = isPwd ? "" : "none";
      });

      form.addEventListener("submit", async (ev) => {
        ev.preventDefault();
        errorEl.classList.remove("show");
        errorEl.textContent = "";

        const phone = phoneInput.value.trim();
        const password = passwordInput.value;
        if (!/^1[3-9]\d{9}$/.test(phone)) {
          errorEl.textContent = "请输入有效的中国大陆手机号码";
          errorEl.classList.add("show");
          return;
        }
        if (!password) {
          errorEl.textContent = "请输入登录密码";
          errorEl.classList.add("show");
          return;
        }

        submitBtn.disabled = true;
        const originalHtml = submitBtn.innerHTML;
        submitBtn.innerHTML = "<span>登录中…</span>";
        try {
          const result = await window.AstockAuth.login(phone, password);
          if (result && result.token) {
            try {
              if (rememberEl.checked) {
                localStorage.setItem("astock_login_phone", phone);
              } else {
                localStorage.removeItem("astock_login_phone");
              }
            } catch (e) { /* ignore */ }
            window.location.replace("/ui/");
          } else {
            throw new Error("登录响应缺少 token");
          }
        } catch (err) {
          errorEl.textContent = err && err.message ? err.message : "登录失败，请稍后再试";
          errorEl.classList.add("show");
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerHTML = originalHtml;
        }
      });
    })();
  </script>
</body>
</html>
