services:
  astock-agents:
    build:
      context: .
      dockerfile: Dockerfile
      # 国内构建如遇网络缓慢，可取消下一行注释加速 pip 依赖安装:
      # args:
      #   PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
    image: a-stock-agents:latest
    container_name: a_stock_agents
    restart: unless-stopped
    ports:
      - "${A_STOCK_SERVER_PORT:-6300}:6300"
    environment:
      - A_STOCK_SERVER_HOST=0.0.0.0
      - A_STOCK_SERVER_PORT=6300
      - A_STOCK_RUNTIME_MODE=production
    env_file:
      - path: .env
        required: false
    volumes:
      # 持久化输出数据：包含股票池(positions.csv)、对话历史数据库(chats.db)、报告(reports)、缓存等
      - ./output:/app/output
      # 自定义配置文件挂载（可选）
      - ./config:/app/config:ro
    extra_hosts:
      # 方便容器内访问宿主机上运行的 Ollama 或本地大模型服务
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:6300/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
